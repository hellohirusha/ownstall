<svg
  width="48"
  height="48"
  viewBox="0 0 48 48"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Ownstall"
>
  <title>Ownstall</title>
  <!--
    The Ownstall mark: a thick white O on a near-black rounded square.
    Same 48-unit geometry as src/components/Logo.tsx and the generated
    PNG/ICO set, so all three stay identical.

    The ring is punched with a mask rather than filled with the ground
    colour, so the counter stays a true hole on any background.
  -->
  <mask id="ownstall-o">
    <rect width="48" height="48" fill="black" />
    <circle cx="24" cy="24" r="14.2" fill="white" />
    <circle cx="24" cy="24" r="8.4" fill="black" />
  </mask>

  <rect width="48" height="48" rx="11" fill="#111111" />
  <rect width="48" height="48" fill="#ffffff" mask="url(#ownstall-o)" />
</svg>
