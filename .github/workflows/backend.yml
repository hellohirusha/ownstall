name: Backend CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths: [backend/**, .github/workflows/backend.yml]
  pull_request:
    branches: [main]
    paths: [backend/**, .github/workflows/backend.yml]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ownstall_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v4
        with:
          # Must match the go directive in backend/go.mod: a lower
          # version silently pulls a second toolchain on every run,
          # and `go mod tidy` output differs between them.
          go-version: "1.25"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        working-directory: backend
        run: go mod download

      # Catches a go.mod that drifted from the imports actually used —
      # the failure mode is a build that works locally from a warm
      # module cache and breaks on a clean checkout.
      - name: Verify go.mod is tidy
        working-directory: backend
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run go vet
        working-directory: backend
        run: go vet ./...

      - name: Run linter
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.4.0
          working-directory: backend

      - name: Run tests
        working-directory: backend
        run: go test ./... -v -race -count=1
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ownstall_test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

  # Advisory, not a gate: gosec's value is the report, and failing the
  # build on every heuristic finding trains people to ignore it.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: "-no-fail -fmt sarif -out gosec-results.sarif ./backend/..."

      - name: Upload gosec report
        uses: actions/upload-artifact@v4
        with:
          name: gosec-results
          path: gosec-results.sarif
          if-no-files-found: warn

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Deploy to Railway
        working-directory: backend
        run: railway up --service=backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
